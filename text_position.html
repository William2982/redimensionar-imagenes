<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionar Texto</title>
    <!-- HTML2Canvas -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <link rel="shortcut icon" href="assets/logo_redimensionar.webp" type="image/x-icon">
    <link rel="stylesheet" href="css/text_position.css">
    <script src="js/text_position.js" defer></script>
</head>

<body>
    <header>
        <nav>
            <div class="logo-container">
                <div class="logo">
                    <a href="/">
                        <img src="assets/logo_redimensionar.webp" alt=" ">
                    </a>
                </div>
                <h2 class="title">Posicionar Texto</h2>
            </div>
            <ul class="nav-links">
                <li><a href="text_position.html">Posicionar Texto</a></li>
                <li><a href="resize.html">Redimensionar</a></li>
                <li><a href="quality.html">Mejorar Calidad</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <section>
        <div class="inputs-container">
            <div class="posicion-container">
                <h3>Posicion</h3>
                <label for="position-unidad">Unidad</label>
                <select id="position-unidad">
                    <option value="px">px</option>
                    <option value="%">%</option>
                </select>
                <br>
                <label for="position-top-input">Top Position:</label>
                <input type="number" id="position-top-input">
                <br>
                <label for="position-bottom-input">Bottom Position:</label>
                <input type="number" id="position-bottom-input">
                <br>
                <label for="position-left-input">Left Position:</label>
                <input type="number" id="position-left-input">
                <br>
                <label for="position-right-input">Right Position:</label>
                <input type="number" id="position-right-input">
            </div>
            <div class="aspecto-container">
                <h3>Aspecto de Imagen</h3>
                <label for="ancho-input">Ancho (px):</label>
                <input type="number" id="ancho-input" value="300">
                <br>
                <label for="alto-input">Alto (px):</label>
                <input type="number" id="alto-input" value="300">
                <br>
                <label for="calidad-input">Calidad de Imagen:</label>
                <input type="number" id="calidad-input" placeholder="1.00 - 9.00" value="3.00">
                <br>
                <label for="file-input">Selecciona una imagen:</label>
                <input type="file" id="file-input" accept="image/*">
            </div>
            <div class="apariencia-container">
                <h3>Apariencia</h3>
                <label for="colorbg-input">Color de Fondo:</label>
                <input type="color" id="colorbg-input" value="#262525">
                <br>
                <label for="opacity-input">Opacidad de Fondo:</label>
                <input type="range" id="opacity-input" min="0" max="1" step="0.1" value="0.5">
                <br>
                <label for="color-input">Color de Letra:</label>
                <input type="color" id="color-input" value="#ffffff">
            </div>
            <div class="texto-container">
                <h3>Texto</h3>
                <label for="bg-texto">Texto (permitido HTML):</label>
                <textarea id="bg-texto"><p>HOLA MUNDO</p></textarea>
                <br>
                <label for="fuente-input">Tamaño de Fuente (px):</label>
                <input type="number" id="fuente-input" value="12">
            </div>
        </div>
        <div class="download-container">
            <button id="download-btn" class="btn">Descargar Imagen</button>
        </div>
    </section>

    <main>
        <label for="file-input">
            <div id="content">
                <div class="bg">
                    <!-- Script -->
                </div>
            </div>
        </label>
    </main>

    <footer>
        <p> <!-- Script --> </p>
    </footer>
</body>

</html>
